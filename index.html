<head>

<style>
  :root{
    --bg:#050508;
    --panel-bg: rgba(255,255,255,0.035);
    --panel-border: rgba(255,255,255,0.09);
    --card-bg: rgba(255,255,255,0.03);
    --card-bg-hover: rgba(255,255,255,0.055);
    --border: rgba(255,255,255,0.09);
    --text:#EDEDF2;
    --text-muted:#8B8B9A;
    --font: 'Sora', sans-serif;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background-color:var(--bg);
    background-image: radial-gradient(720px 480px at 50% -8%, rgba(88,101,242,0.14), transparent 65%);
    background-repeat:no-repeat;
    color:var(--text);
    font-family:var(--font);
  }

  body{
    position:relative;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  canvas#stars{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    display:block;
  }

  .panel{
    position:relative;
    z-index:1;
    width:100%;
    max-width:980px;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:32px;
    padding:44px 48px 36px;
    display:flex;
    flex-direction:column;
    gap:18px;
    backdrop-filter:blur(6px);
    box-shadow:0 30px 60px -30px rgba(0,0,0,0.6);
  }

  .identity{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:4px;
    margin-bottom:12px;
  }

  .avatar-wrap{
    width:136px;
    height:136px;
    border-radius:50%;
    padding:6px;
    border:2px solid var(--ring-color,#747F8D);
    margin-bottom:16px;
    transition:border-color .3s ease;
  }

  .avatar{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }

  .name{
    font-family:var(--font);
    font-weight:800;
    font-size:clamp(28px,5vw,36px);
    margin:0;
    letter-spacing:-0.01em;
  }

  .tagline{
    margin:0;
    color:var(--text-muted);
    font-size:14px;
    font-family:var(--font);
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  .clock{
    margin:9px 0 0;
    font-family:var(--font);
    font-weight:500;
    font-size:14.5px;
    color:var(--text-muted);
  }
  .clock-label{ opacity:0.65; }

  /* ---- Общие карточки-ссылки ---- */
  .card{
    position:relative;
    display:flex;
    align-items:center;
    gap:18px;
    padding:20px 22px;
    border-radius:22px;
    background:var(--card-bg);
    border:1px solid var(--border);
    text-decoration:none;
    color:inherit;
    transition:border-color .25s ease, box-shadow .25s ease, transform .15s ease, background .25s ease;
  }
  .card:hover, .card:focus-visible{
    border-color:var(--accent);
    background:var(--card-bg-hover);
    box-shadow:0 0 0 1px var(--accent), 0 0 30px -8px var(--accent);
    transform:translateY(-1px);
  }
  .card:focus-visible{ outline:none; }

  .tile-icon{
    flex-shrink:0;
    width:64px;
    height:64px;
    object-fit:contain;
  }

  .card-avatar{
    width:60px;
    height:60px;
    border-radius:16px;
    object-fit:cover;
    flex-shrink:0;
    background:rgba(255,255,255,0.06);
    box-shadow:0 8px 24px rgba(0,0,0,.28);
  }

  .card-icon-img{
    width:72px;
    height:72px;
    border-radius:16px;
    object-fit:cover;
    flex-shrink:0;
  }

  .card-body{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    min-width:0;
  }

  .card-title{
    font-weight:700;
    font-size:18px;
    line-height:1.1;
  }

  .chip{
    display:inline-flex;
    align-items:center;
    max-width:100%;
    padding:4px 11px;
    border-radius:9px;
    font-size:12.5px;
    font-weight:600;
    font-family:var(--font);
    color:var(--accent);
    background:color-mix(in srgb, var(--accent) 16%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .status-dot{
    position:absolute;
    right:16px;
    top:16px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#747F8D;
  }
  .status-dot::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:inherit;
    animation:pulse-dot 2s ease-out infinite;
  }
  @keyframes pulse-dot{
    0%{ box-shadow:0 0 0 0 rgba(255,255,255,0.3); }
    100%{ box-shadow:0 0 0 7px rgba(255,255,255,0); }
  }

  /* ---- Сетка квадратных плиток ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
  }

  .tile{
    aspect-ratio:16 / 9;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:14px;
    padding:20px 18px;
    min-width:0;
  }

  .tile .card-body{
    align-items:center;
    justify-content:center;
    gap:8px;
    min-width:0;
    width:100%;
  }

  .tile .card-title{
    font-size:17px;
    line-height:1.2;
  }

  .tile .chip{
    max-width:100%;
  }

  .tile-icon{
    width:76px;
    height:76px;
    flex-shrink:0;
    object-fit:contain;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.28));
  }

  @media (max-width:760px){
    .grid{ grid-template-columns:repeat(2, 1fr); }
  }

  @media (max-width:520px){
    .grid{ grid-template-columns:1fr; }
    .tile{
      aspect-ratio:16 / 9;
      padding:18px;
    }
    .tile-icon{
      width:72px;
      height:72px;
    }
  }

  .footer{
    margin-top:16px;
    text-align:center;
    font-size:12.5px;
    font-weight:500;
    color:var(--text-muted);
    line-height:1.6;
  }
  .footer a{
    color:var(--text);
    text-decoration:none;
    border-bottom:1px solid var(--border);
  }
  .footer a:hover{ border-color:var(--text); }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
    .status-dot::after{ animation:none; }
  }
</style>
</head>

<script>
  // ---------- Летающие звёзды ----------
  (function(){
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w, h, particles;

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function makeParticles(){
      const count = Math.min(130, Math.floor((w * h) / 13000));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3,
        vx: (Math.random() - 0.5) * 0.18,
        vy: (Math.random() - 0.5) * 0.18,
        baseAlpha: Math.random() * 0.5 + 0.2,
        twinkleSpeed: Math.random() * 0.02 + 0.006,
        twinklePhase: Math.random() * Math.PI * 2
      }));
    }

    function step(t){
      ctx.clearRect(0, 0, w, h);
      for (const p of particles){
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;

        const alpha = reduceMotion
          ? p.baseAlpha
          : p.baseAlpha * (0.55 + 0.45 * Math.sin(p.twinklePhase + t * p.twinkleSpeed));

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fill();
      }
      if (!reduceMotion) requestAnimationFrame(step);
    }

    window.addEventListener('resize', () => { resize(); makeParticles(); });
    resize();
    makeParticles();
    if (reduceMotion) step(0); else requestAnimationFrame(step);
  })();

  // ---------- Часы (Москва) ----------
  function updateClock(){
    const fmt = new Intl.DateTimeFormat('ru-RU', {
      timeZone: 'Europe/Moscow',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    document.getElementById('clock-time').textContent = fmt.format(new Date());
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---------- Discord (Lanyard API) ----------
  // Требует, чтобы аккаунт состоял на сервере Lanyard (discord.gg/lanyard) —
  // иначе присутствие не отслеживается и карточка останется статичной.
  const DISCORD_ID = '992421204881309757';
  const STATUS_LABEL = { online: 'В сети', idle: 'Нет на месте', dnd: 'Не беспокоить', offline: 'Не в сети' };
  const STATUS_COLOR = { online: '#3BA55D', idle: '#FAA61A', dnd: '#ED4245', offline: '#747F8D' };

  async function updateDiscord(){
    try {
      const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
      const json = await res.json();
      if (!json.success) throw new Error('lanyard error');
      const d = json.data;

      const avatarUrl = d.discord_user.avatar
        ? `https://cdn.discordapp.com/avatars/${d.discord_user.id}/${d.discord_user.avatar}.png?size=128`
        : 'https://cdn.discordapp.com/embed/avatars/0.png';
      document.getElementById('discord-avatar').src = avatarUrl;
      document.getElementById('discord-name').textContent = d.discord_user.global_name || d.discord_user.username;

      let statusText = STATUS_LABEL[d.discord_status] || 'Неизвестно';
      const playing = (d.activities || []).find(a => a.type === 0);
      if (playing) {
        statusText += ` • ${playing.name}`;
      } else if (d.listening_to_spotify && d.spotify) {
        statusText += ` • ${d.spotify.song}`;
      }
      document.getElementById('discord-status').textContent = statusText;

      const color = STATUS_COLOR[d.discord_status] || '#747F8D';
      document.getElementById('discord-dot').style.background = color;
      document.getElementById('avatar-ring').style.setProperty('--ring-color', color);
    } catch (e) {
      // офлайн/нет доступа к Lanyard — оставляем статичную ссылку
    }
  }
  updateDiscord();
  setInterval(updateDiscord, 20000);

  // ---------- Steam ----------
  // steamcommunity.com не отдаёт CORS-заголовки напрямую, поэтому запрос идёт
  // через публичный CORS-прокси. Это best-effort: если прокси недоступен,
  // остаётся статичный текст. Для полностью надёжного live-обновления
  // понадобится небольшой собственный сервер-прокси (Cloudflare Worker и т.п.).
  async function updateSteam(){
    try {
      const target = encodeURIComponent('https://steamcommunity.com/id/ChocapicFox/?xml=1');
      const res = await fetch(`https://corsproxy.io/?url=${target}`);
      const text = await res.text();
      const xml = new DOMParser().parseFromString(text, 'text/xml');
      const name = xml.querySelector('steamID')?.textContent;
      if (name) document.getElementById('steam-sub').textContent = name;
    } catch (e) {
      // прокси недоступен — оставляем статичный ник
    }
  }
  updateSteam();
  setInterval(updateSteam, 120000);

  // ---------- Enka.Network (Genshin / HSR / ZZZ) ----------
  async function updateGenshin(){
    try {
      const res = await fetch('https://enka.network/api/uid/724428194');
      const data = await res.json();
      const info = data.playerInfo;
      document.getElementById('genshin-sub').textContent = `AR ${info.level} • ${info.nickname}`;
    } catch (e) { /* оставляем UID */ }
  }

  async function updateHSR(){
    try {
      const res = await fetch('https://enka.network/api/hsr/uid/700012749');
      const data = await res.json();
      const info = data.detailInfo;
      document.getElementById('hsr-sub').textContent = `TL ${info.level} • ${info.nickname}`;
    } catch (e) { /* оставляем UID */ }
  }

  async function updateZZZ(){
    try {
      const res = await fetch('https://enka.network/api/zzz/uid/1501061669');
      const data = await res.json();
      const info = data.PlayerInfo?.SocialDetail?.ProfileDetail || data.PlayerInfo || {};
      const nickname = info.Nickname || info.nickname;
      const level = info.Level || info.level;
      if (level) {
        document.getElementById('zzz-sub').textContent = nickname ? `IL ${level} • ${nickname}` : `IL ${level}`;
      }
    } catch (e) { /* оставляем UID */ }
  }

  updateGenshin();
  updateHSR();
  updateZZZ();
  setInterval(updateGenshin, 300000);
  setInterval(updateHSR, 300000);
  setInterval(updateZZZ, 300000);
</script>
